<!DOCTYPE html>
<html lang="vi">
<head>

<meta name="theme-color" content="#ff8db5">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍲</text></svg>">
<title>Tiệm Buffet Nhỏ</title>
<style>
:root{--bg:#fffaf8;--card:#ffffff;--ink:#6b3a4e;--mute:#b48a9c;--acc:#ff6f9f;--acc2:#ff9dbf;--ok:#2fb98a;--bad:#f0506e;--line:#ffe4ee;--star:#ffb020;--shadow:#ff3f80;--grad1:#ff8db5;--grad2:#ff5f97;color-scheme:only light}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#fffaf8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg,#fffaf8)!important;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;min-height:100vh}
#app{width:100%;max-width:440px;padding:12px 14px 110px}
.top{display:flex;align-items:center;justify-content:space-between;gap:6px;background:linear-gradient(135deg,var(--grad1,#ff8db5),var(--grad2,#ffb3cf));color:#fff;border-radius:20px;padding:10px 12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 4px 0 var(--shadow)}
.top b{display:block;font-size:15px}.top small{color:#1a1a1a;opacity:1;font-size:12px;font-weight:600}
.top .grow{flex:1;min-width:0}
#hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tables{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tbl{flex:1 1 76px;min-width:76px;max-width:120px;background:#fff;border:2px solid var(--line,#ffd3e2);border-radius:14px;padding:5px 6px;text-align:center;cursor:pointer;font-size:11px}
.tbl.sel{border-color:var(--acc,#ff5c9a);box-shadow:0 0 0 2px var(--acc,#ff5c9a) inset;background:var(--line,#ffe6ef)}
.tbl.empty{opacity:.45;cursor:default}
.tbl .tav{display:block;font-size:20px;line-height:1.3}
.tbl small{display:block;font-size:10px;word-break:break-word}
.money-tag{margin:8px 0 10px;text-align:center;background:#fff;color:var(--ink,#333);border:2px solid var(--line,#ffd3e2);border-radius:14px;padding:6px 14px;font-size:14px;font-weight:800;box-shadow:0 3px 0 var(--shadow,#f3b6cc)}
.money{font-size:20px;font-weight:800;text-align:center;flex:0 0 auto;min-width:70px;padding:0 4px}
.stars{color:#fff3b0;font-size:14px;text-align:right;min-width:48px}
h2{font-size:16px;margin:18px 4px 8px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.em{font-size:28px}
button{font:inherit;border:0;border-radius:14px;padding:8px 12px;background:var(--line);color:var(--ink);font-weight:700;cursor:pointer}
button:active{transform:scale(.96)}
button.pri{background:linear-gradient(var(--grad1,#ff8db5),var(--grad2,#ff5f97));color:#fff;width:100%;padding:14px;font-size:17px;margin-top:10px;box-shadow:0 4px 0 var(--shadow)}
button:disabled{opacity:.4}
small,.mu{color:var(--mute)}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff9dbf,#ff5f97);transition:width .3s}
.bar.pat i{background:linear-gradient(90deg,#2fb98a,#ffb020,#f0506e)}
.log{font-size:13px;color:var(--mute);line-height:1.7;min-height:60px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .card{margin:0;text-align:center}.grid b{font-size:18px;display:block}
.g{color:var(--ok)}.r{color:var(--bad)}.st{color:var(--star)}
.hero{min-height:85vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}
.hero .big{font-size:88px}.hero h1{font-size:32px;margin:10px 0}.hero p{color:var(--mute);line-height:1.6;margin:0 0 18px}
.dots{display:flex;gap:6px;margin-bottom:6px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--acc)}
input,textarea{font:inherit;width:100%;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;margin-bottom:6px}
textarea{min-height:80px;resize:vertical}
.pop{position:absolute;right:14px;top:50px;color:#fff;background:var(--ok);border-radius:10px;padding:1px 8px;font-weight:800;font-size:14px;animation:up .7s ease-out forwards;pointer-events:none}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-22px)}}
#tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;display:flex;background:var(--card);border-top:2px solid var(--line);border-radius:22px 22px 0 0;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:9}
#tabs button{flex:1;background:none;padding:4px 0;font-size:10px;color:var(--mute);position:relative;border-radius:12px}
#tabs button span{display:block;font-size:22px}#tabs button.on{background:var(--line);color:var(--acc)}
.bd{position:absolute;top:0;right:8px;background:var(--bad);color:#fff;border-radius:9px;min-width:16px;height:16px;font-size:10px;line-height:16px}
.chip{display:inline-block;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:700;margin:4px 4px 0 0;color:#fff}.chip.g{background:var(--ok)}.chip.r{background:var(--bad)}
.av{width:44px;height:44px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:26px;flex:none}
.bub{max-width:82%;padding:8px 12px;border-radius:16px;margin:6px 0;font-size:14px;line-height:1.45}
.bub.c{background:var(--card);border:2px solid var(--line)}.bub.m{background:var(--acc);color:#fff;margin-left:auto}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);margin-top:6px;font-weight:600}
#modal{position:fixed;inset:0;background:rgba(80,20,50,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.mb{background:var(--card);border-radius:24px;padding:18px;max-width:400px;width:100%;text-align:center;max-height:92vh;overflow:auto}
.mb .av{width:76px;height:76px;font-size:44px;margin:0 auto 8px;border:3px solid var(--acc)}
.tag{display:inline-block;background:var(--bad);color:#fff;border-radius:12px;padding:3px 12px;font-size:12px;font-weight:800;letter-spacing:1px}
.mb h3{font-size:20px;margin:10px 0 6px}.mb p{color:var(--mute);margin:0 0 12px;line-height:1.5}
.mb button.o{display:block;width:100%;padding:11px;margin-top:8px}.mb button.o small{display:block;font-weight:400}
.mb button.main{background:linear-gradient(#ff8db5,#ff5f97);color:#fff;box-shadow:0 3px 0 var(--shadow)}.mb button.main small{color:#ffe4ef}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:14px;font-size:14px;z-index:30;display:none}
.menu-board{background:var(--card,#fff);color:var(--ink);border-radius:20px;padding:14px 16px;margin:10px 0;border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.menu-board h3{text-align:center;margin:0 0 12px;font-size:17px;color:var(--acc);font-weight:800}
.menu-board .ml{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:14px;border-radius:12px;margin-bottom:4px;background:var(--bg,#fffaf8)}
.menu-board .ml:last-child{margin-bottom:0}
.menu-board .ml .ok{color:var(--ok);font-weight:700;font-size:13px}
.menu-board .ml .het{color:var(--bad);font-weight:700;font-size:13px}
.menu-board .sec{margin:12px 0 6px;font-size:12px;color:var(--mute);font-weight:800;letter-spacing:.3px}
.serve-area{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
.cust-order{background:linear-gradient(135deg,#fff5f8,#ffe8f0);border-radius:14px;padding:10px 12px;margin-bottom:10px;border:2px solid var(--line)}
.pat-wrap{margin:6px 0}
.dish-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.dish-btn{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:11px;cursor:pointer;position:relative}
.dish-btn .em{font-size:22px;display:block}
.dish-btn .qty-badge{position:absolute;top:2px;right:2px;background:var(--acc);color:#fff;border-radius:8px;font-size:10px;padding:0 5px;font-weight:800}
.dish-btn.on{border-color:var(--acc);background:#fff0f5}
.dish-btn.dis{opacity:.35;pointer-events:none}
.tray{background:#fff8fb;border:2px dashed var(--acc);border-radius:12px;padding:8px;min-height:50px;margin:8px 0;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tray-item{background:var(--acc);color:#fff;border-radius:8px;padding:2px 8px;font-size:13px}
.bell{background:linear-gradient(#ffb020,#ff8c00);color:#fff;width:100%;padding:14px;font-size:18px;border-radius:16px;box-shadow:0 4px 0 #cc7000;margin-top:8px}
.bell:disabled{opacity:.4;box-shadow:none}
.police-btn{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:12;width:56px;height:56px;border-radius:50%;background:linear-gradient(#ff4d6d,#e63950);color:#fff;font-size:22px;display:grid;place-items:center;box-shadow:0 4px 12px rgba(230,57,80,.45);border:3px solid #fff;padding:0;line-height:1}
.police-btn:disabled,.police-btn.off{opacity:.35;filter:grayscale(.6);pointer-events:none;box-shadow:none}
.police-btn small{font-size:9px;font-weight:800;display:block;margin-top:-2px}
.clock{font-size:15px;font-weight:700;color:var(--acc)}
.ut-row{display:flex;gap:8px;margin:6px 0;font-size:13px;flex-wrap:wrap}
.reply-btn{background:var(--line);color:var(--acc);border-radius:10px;padding:4px 12px;font-size:13px;margin-top:6px}
.set-btn-inline{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.28);border:0;font-size:17px;display:grid;place-items:center;flex:none;padding:0;color:#fff;margin-right:4px}
.free-reply{margin-top:10px;text-align:left}
.free-reply textarea{min-height:60px;font-size:14px}
.sec-label{font-size:12px;font-weight:700;color:var(--mute);margin:10px 0 4px}
.set-list{text-align:left}
.set-item{display:flex;align-items:center;gap:10px;background:var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.set-item .ico{font-size:22px;width:28px;text-align:center}
.set-item .lab{flex:1;font-weight:600;font-size:14px}
.set-item .val{font-size:12px;color:var(--mute);font-weight:500}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.theme-cell{border:2px solid #f0e8ec;border-radius:16px;padding:12px 6px;text-align:center;cursor:pointer;font-size:12px;font-weight:600;background:#fff}
.theme-cell.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.theme-swatch{width:40px;height:40px;border-radius:50%;margin:0 auto 8px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.12);overflow:hidden;position:relative}
.theme-swatch::before{content:'';position:absolute;left:0;top:0;width:50%;height:100%;background:var(--sw1,#fff)}
.theme-swatch::after{content:'';position:absolute;right:0;top:0;width:50%;height:100%;background:var(--sw2,#ff6f9f)}
.credit{text-align:center;font-size:11px;color:var(--mute);margin-top:14px;line-height:1.5}
/* Loading */
#loading{position:fixed;inset:0;z-index:9999;background:linear-gradient(180deg,#fff5f8 0%,#ffe8f0 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;transition:opacity .45s}
#loading.hide{opacity:0;pointer-events:none}
.load-title{font-size:22px;font-weight:800;color:#6b3a4e;margin:16px 0 6px}
.load-sub{font-size:13px;color:#9a6a7a;margin-bottom:14px}
.load-pct{font-size:12px;color:#9a6a7a;margin-top:8px;font-weight:700}
.load-btns{margin-top:18px;width:min(280px,80vw);display:none;flex-direction:column;gap:8px}
.load-btns.show{display:flex}
.load-btns button{width:100%;padding:14px;border-radius:16px;font-weight:800;font-size:15px;border:none;cursor:pointer}
.load-btns .go{background:linear-gradient(135deg,#ff8db5,#ff5f97);color:#fff;box-shadow:0 4px 0 #e04080}
.load-btns .cont{background:#fff;color:#6b3a4e;border:2px solid #ffb3cf!important}
.load-sub{font-size:13px;color:#b48a9c;margin-bottom:28px}
.candy-track{width:min(280px,80vw);height:22px;background:#fff;border-radius:12px;border:3px solid #ff8db5;overflow:hidden;position:relative;box-shadow:0 3px 0 #ffb3cf}
.candy-bar{height:100%;width:0%;border-radius:8px;background:repeating-linear-gradient(-45deg,#ff5f97 0 10px,#fff 10px 20px,#ff8db5 20px 30px,#fff 30px 40px);background-size:40px 100%;animation:candyMove 0.6s linear infinite;transition:width .15s}
@keyframes candyMove{from{background-position:0 0}to{background-position:40px 0}}
.load-pct{margin-top:10px;font-size:14px;font-weight:700;color:#ff6f9f}
/* Shop illustration */
.shop-art{width:100%;max-width:320px;margin:0 auto 8px}
.shop-art svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 12px rgba(255,111,159,.2))}
html,body,*{touch-action:manipulation;-webkit-text-size-adjust:100%}
html,body{touch-action:manipulation;touch-action:pan-x pan-y;overscroll-behavior:none;-ms-touch-action:pan-x pan-y}
button,a,input,select,textarea,[onclick]{touch-action:manipulation}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;font-size:16px}
.cust-order{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:4}
.dock{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--bg);padding:6px 0 2px;border-top:2px solid var(--line)}
.mk-bar{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);padding:6px 0}
</style>

<script>
/* ===== KHOÁ ZOOM ===== */
['gesturestart','gesturechange','gestureend'].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault(),{passive:false}));
document.addEventListener('touchmove',ev=>{if(ev.touches.length>1)ev.preventDefault()},{passive:false});
addEventListener('wheel',ev=>{if(ev.ctrlKey)ev.preventDefault()},{passive:false});
/* chặn zoom khi chạm nhanh 2 lần (iOS Safari/Chrome + Android): bắt ở tầng window, capture */
let _lastTap=0,_lastX=0,_lastY=0;
window.addEventListener('touchend',ev=>{
if(ev.touches&&ev.touches.length>0)return;
const n=Date.now(),ct=ev.changedTouches&&ev.changedTouches[0];
const x=ct?ct.clientX:0,y=ct?ct.clientY:0;
const dt=n-_lastTap;
if(dt>0&&dt<450){
// tap thứ 2 của cú chạm đúp → huỷ hành vi zoom mặc định của trình duyệt
if(ev.cancelable)ev.preventDefault();
const t=document.elementFromPoint(x,y)||ev.target;
if(t&&t.click&&!(t.matches&&t.matches('input,textarea,select,a,label')))t.click();
_lastTap=0;return
}
_lastTap=n;_lastX=x;_lastY=y
},{passive:false,capture:true});
// Ép touch-action ngay trên <html>/<body> bằng JS (phòng khi CSS bị bỏ qua)
try{document.documentElement.style.touchAction='manipulation';document.documentElement.style.webkitTextSizeAdjust='100%';addEventListener('DOMContentLoaded',()=>{document.body.style.touchAction='manipulation'})}catch(e){}
document.addEventListener('dblclick',ev=>ev.preventDefault(),{passive:false});
/* ===== KHOÁ ZOOM TRIỆT ĐỂ (iOS Safari/Chrome, Android, máy tính) ===== */
(function(){
const opt={passive:false,capture:true};
const stop=e=>{e.preventDefault();e.stopPropagation&&e.stopPropagation()};
['gesturestart','gesturechange','gestureend'].forEach(n=>{window.addEventListener(n,stop,opt);document.addEventListener(n,stop,opt)});
// Chạm từ 2 ngón trở lên → chặn (pinch)
['touchstart','touchmove'].forEach(n=>document.addEventListener(n,e=>{if((e.touches&&e.touches.length>1)||(e.scale&&e.scale!==1))e.preventDefault()},opt));
// Meta viewport luôn khoá
const meta=document.querySelector('meta[name=viewport]');
const LOCK='width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover';
function relock(){if(!meta)return;meta.setAttribute('content',LOCK)}
// Nếu trình duyệt vẫn zoom được → ép về 100% ngay
function resetZoom(){
const vv=window.visualViewport;
if(vv&&Math.abs(vv.scale-1)>0.01){
if(meta){meta.setAttribute('content','width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no');
setTimeout(relock,60)}
window.scrollTo(0,window.scrollY)
}
}
if(window.visualViewport){visualViewport.addEventListener('resize',resetZoom);visualViewport.addEventListener('scroll',()=>{if(Math.abs(visualViewport.scale-1)>0.01)resetZoom()})}
document.addEventListener('focusout',()=>setTimeout(resetZoom,120));
relock();
})();
/* chặn Ctrl + / Ctrl - / Ctrl 0 trên máy tính */
addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&['+','-','=','0','_'].includes(ev.key))ev.preventDefault()});
addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&'+-=_0'.includes(ev.key))ev.preventDefault()});

(function(){const b=new Blob([JSON.stringify(MANIFEST)],{type:"application/json"});const u=URL.createObjectURL(b);const l=document.createElement("link");l.rel="manifest";l.href=u;document.head.appendChild(l)})();
if("serviceWorker" in navigator){
const swCode=`self.addEventListener('install',e=>{self.skipWaiting()});self.addEventListener('activate',e=>{e.waitUntil(clients.claim())});self.addEventListener('fetch',e=>{e.respondWith(caches.open('buffet-v2').then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(res=>{if(e.request.url.startsWith(self.location.origin))c.put(e.request,res.clone());return res}).catch(()=>caches.match('./'))))})`;
navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode],{type:"application/javascript"}))).catch(()=>{});
}

function allItems(){return [...D,...TOP,...PHO,...UT]}
function findItem(id){return allItems().find(x=>x.id===id)}
function costOf(id){const it=findItem(id);return it?it.c:0}
function sellOf(id){const it=findItem(id);if(!it)return 0;const v=S.sellPrice&&S.sellPrice[id];return v!=null?v:Math.round(it.c*2/500)*500}
function setSell(id,d){const it=findItem(id);if(!S.sellPrice)S.sellPrice={};const was=sellOf(id)>=it.c*10;S.sellPrice[id]=clamp(sellOf(id)+d,it.c,it.c*15);sfx('click');

function sellCtl(id){const it=findItem(id),bad=sellOf(id)>=it.c*10;return `<div style="margin-top:6px;font-size:12px">💰 ${currentLang==='en'?'Sell price':'Giá bán'}: <button style="padding:2px 8px" onclick="setSell('${id}',-5000)">−−</button> <button style="padding:2px 9px" onclick="setSell('${id}',-500)">−</button> <b class="${bad?'r':''}">${fmt(sellOf(id))}</b> <button style="padding:2px 9px" onclick="setSell('${id}',500)">+</button> <button style="padding:2px 8px" onclick="setSell('${id}',5000)">++</button> <small>(${currentLang==='en'?'cost':'nhập'} ${fmt(it.c)})</small></div>${bad?'<div class="r" style="font-size:12px;font-weight:700;margin-top:4px">🐶 Bán Rẻ thì lỗ mà Đắt Quá thì chó cũng không ăn</div>':''}`}

let audioCtx=null,soundOn=true,sfxOn=true,musicOn=true,bgInterval=null;
function ensureAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(soundOn&&audioCtx.state!=='running')audioCtx.resume()}
function playTone(freq,dur,type='sine',vol=.15){if(!sfxOn)return;ensureAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audioCtx.destination);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur)}
function sfx(name){if(!sfxOn)return;if(name==='click')playTone(800,.06,'square',.08);else if(name==='bell'){playTone(880,.15,'sine',.2);setTimeout(()=>playTone(1175,.2,'sine',.15),80)}else if(name==='coin'){playTone(1200,.08,'square',.12);setTimeout(()=>playTone(1600,.1,'square',.1),60)}else if(name==='bad')playTone(200,.25,'sawtooth',.12);else if(name==='pop')playTone(600,.1,'triangle',.1);else if(name==='msg'){playTone(500,.08,'sine',.1);setTimeout(()=>playTone(700,.1,'sine',.08),70)}}
function startBGM(){
if(!musicOn)return;
if(bgInterval)return;ensureAudio();
const melody=[
392,440,494,523,
587,659,587,523,
494,523,587,659,
784,659,587,523,
440,494,523,587,
659,784,880,784,
659,587,523,494,
440,392,440,523];
const durations=[
300,300,300,500,
300,300,300,500,
300,300,300,500,
600,300,300,600,
300,300,300,500,
300,300,300,500,
300,300,300,500,
600,300,300,800];
let i=0;
const step=()=>{
if(!musicOn||!audioCtx){bgInterval=null;return}
const f=melody[i%melody.length],d=durations[i%durations.length]/1000;
const t=audioCtx.currentTime;
const o=audioCtx.createOscillator(),g=audioCtx.createGain();
o.type='triangle';o.frequency.value=f;
g.gain.setValueAtTime(0,t);
g.gain.linearRampToValueAtTime(.05,t+.03);
g.gain.exponentialRampToValueAtTime(.001,t+d*.95);
o.connect(g);g.connect(audioCtx.destination);
o.start(t);o.stop(t+d);
i++;
bgInterval=setTimeout(step,d*1000)
};
step()
}
function stopBGM(){if(bgInterval){clearTimeout(bgInterval);bgInterval=null}}

function genShortId(len){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<len;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function getMyRefCode(){
let code=localStorage.getItem('buffet_my_ref');
if(code&&/^TBF\d{7}$/.test(code))return code;
// Mã duy nhất theo máy: TBF + 7 số
let n='';
try{
let h=0;const seed=(navigator.userAgent||'')+(screen.width||0)+(screen.height||0)+Date.now();
for(let i=0;i<seed.length;i++)h=((h<<5)-h)+seed.charCodeAt(i)|0;
n=String(Math.abs(h)%10000000).padStart(7,'0');
}catch(e){n=String(Math.floor(Math.random()*1e7)).padStart(7,'0')}
code='TBF'+n;
localStorage.setItem('buffet_my_ref',code);
return code
}

function isRude(txt){
const norm=String(txt).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
const words=norm.replace(/[^a-z0-9]+/g,' ').trim();
const flat=norm.replace(/[^a-z0-9]+/g,'');
const tokens=new Set(words.split(' '));
const badTok=['cut','dm','dmm','dcm','dcmm','dkm','dit','ditme','dume','dumemay','vcl','vkl','vl','vcc','cc','cl','cmm','cmn','clgt','clm','loz','lon','lol','buoi','cac','cak','deo','ngu','oc','cam','khung','dien','sung','rac','nat','xam','hoang']
  .filter(w=>!['oc','cam','sung','rac','nat','hoang','lol'].includes(w));
if(badTok.some(w=>tokens.has(w)))return true;
const phrases=['d m','d m m','d c m','d k m','v c l','v k l','d i t','c m m','cut di','cut ngay','cut xuong','bien di','bien ngay','cam mom','cam di','im di','im mieng','di chet','chet di','chet me','chet tiet','me may','cha may','do ngu','thang ngu','con ngu','ngu vl','oc cho','oc lon','con cho','thang cho','do cho','suc vat','mat day','do khon','khon nan','do dien','do khung','thang dien','thang khung','con dien','rac ruoi','vo hoc','du ma','dit me','dit con','deo can','deo them','deo ban','xam lon','khong them ban','khong tiep','an cut','ra khoi quan','dep quan','dap quan','cook quan','cuoc di'];
if(phrases.some(p=>(' '+words+' ').includes(' '+p+' ')))return true;
const flatBad=['ditme','ditmemay','dumemay','dumay','concho','occho','matday','thangcho','dcmm','vclon','clgt','dkm','vcl','vkl','cmm'];
return flatBad.some(w=>flat.includes(w))
}
const RUDE_CUST=['Chủ quán gì mà chửi khách vậy?! Mình đánh giá 1 sao!','Thái độ tệ quá, không bao giờ quay lại nữa!','Bị chủ quán mắng, mình sẽ review 1 sao cho cả xóm biết!','Quá đáng thật sự… 1 sao và block quán!'];
function analyzeFreeReply(txt){const t=txt.toLowerCase();let mood=0;const good=['cảm ơn','xin lỗi','giảm','tặng','miễn','voucher','ưu đãi','còn chỗ','được','ok','dạ','vui','chào','hẹn'];const bad=['không','hết','từ chối','không có','đắt','không nhận','kín','hết chỗ'];good.forEach(w=>{if(t.includes(w))mood++});bad.forEach(w=>{if(t.includes(w))mood--});return mood>0?'good':mood<0?'bad':'neutral'}
const FREE_RESP={good:[{c:'Ôi cảm ơn quán nhiều! Mình sẽ ghé ngay 💕',m:80000,r:.12},{c:'Tuyệt vời quá, mình chốt luôn nha!',m:120000,r:.1},{c:'Quán dễ thương thế, mình giới thiệu bạn bè nữa!',m:60000,r:.15},{c:'Yay! Cảm ơn em nhiều ạ 🥰',m:50000,r:.08}],neutral:[{c:'Ok bạn, mình biết rồi.',m:20000,r:0},{c:'Cảm ơn thông tin nha.',m:10000,r:0},{c:'Mình sẽ cân nhắc thêm.',m:0,r:0},{c:'Ok em.',m:15000,r:.02}],bad:[{c:'Tiếc quá… mình đi quán khác vậy.',m:0,r:-.08},{c:'Hơi thất vọng, thôi vậy.',m:0,r:-.12},{c:'Ok, cảm ơn.',m:0,r:-.05},{c:'Vậy à… buồn nhỉ.',m:0,r:-.1}]};

function phoAdd(i,k){

else if(k==='top'){const tid=b.top||'pho_bo';if((S.stock[tid]||0)<1&&!tr.top)return;tr.top=tr.top?null:tid}
else if(k==='hanh'){if((S.stock.pho_hanh||0)<1&&!tr.hanh)return;tr.hanh=tr.hanh?0:1}

}
function phoMatch(c){
if(!L.phoTray||L.phoTray.length!==c.bowls.length)return false;
if((S.ut.bat||0)<c.bowls.length)return false;
for(let i=0;i<c.bowls.length;i++){
const b=c.bowls[i],tr=L.phoTray[i];
if(!tr.ban||!tr.dung)return false;
if(b.top&&tr.top!==b.top)return false;
if(b.noHanh&&tr.hanh)return false;
if(b.hanh&&!tr.hanh)return false;

}

}

function ringBell(){
if(!L||!L.cur)return;

S.ut.dua-=needDua;S.ut.bat-=needBat;
const kids=c.ic.filter(i=>'👧👦'.includes(i)).length;

}
}
S.money+=pay;L.rev+=pay;L.pop=pay;L.served+=c.ppl;L.scores.push(s);

S.fbs=S.fbs.slice(0,50);

h+=UP.map(u=>{const lv=S.up[u.id],c=u.b*(lv+1),mx=lv>=u.max;return `<div class="card row"><div class="em">${u.e}</div><div class="grow"><b>${itemN(u)} · ${t('lv')} ${lv}/${u.max}</b><br><small>${itemD(u)}${u.id==='seat'?` (${S.seats} ${t('seats')})`:''}</small></div><button onclick="upg('${u.id}')" ${mx||S.money<c?'disabled':''}>${mx?t('max'):fmt(c)}</button></div>`}).join('');
}else if(sub==='nv'){
h+=`<div class="card"><small>${t('staffHint')}</small></div>`;
h+=STAFF.map(st=>{
const on=!!S.staff[st.id];
const locked=st.needOnline&&!S.online;
return `<div class="card row"><div class="em">${st.e}</div><div class="grow"><b>${st.name}</b> · ${staffN(st)}<br><small>${staffD(st)}</small>
<br><small>${t('salary')} <b>${fmt(st.sal)}</b>/${currentLang==='en'?'day':'ngày'} · ${t('hireCost')} <b>${fmt(st.hire)}</b></small></div>
<button onclick="hireStaff('${st.id}')" ${locked?'disabled':''} style="${on?'background:var(--bad);color:#fff':''}">${locked?t('needOnline'):on?t('fire'):t('hire')}</button></div>`
}).join('');
}else{
const on=S.online;
h+=`<div class="card">
<div class="row"><div class="em">🛵</div><div class="grow"><b>${t('onlineTitle')}</b><br>
<small>${t('onlineHint')} (~${on?'40':'15'}%)</small></div></div>
<div style="margin-top:8px"><small>${currentLang==='en'?'Fee':'Phí mở'}: <b>200K</b></small></div>
<button class="pri" style="margin-top:8px" onclick="toggleOnline()">${on?t('onlineOn'):t('onlineOff')}</button>
</div>
<div class="card"><small>🚚 Gréb · Blue Ngon · Bê · Shịppé · 10K/km</small></div>`;
}
return h
}
function msgTab(){if(S.th){const m=S.msgs.find(x=>x.id===S.th);if(m){const d=MS[m.d];let h=`<div class="row" style="margin:14px 0 6px"><button onclick="S.th=null;sfx('click');render()">‹</button><div class="av">${m.ic}</div><b>${m.n}</b></div><div class="bub c">${d.q}</div>`;if(m.done===null){h+=`<small>${t('quickReply')}</small>`+d.o.map((o,i)=>`<button class="opt" onclick="reply(${m.id},${i})">${o.t}</button>`).join('');h+=`<div class="free-reply"><small>${t('freeReply')}</small><textarea id="freeMsg" placeholder="..."></textarea><button class="pri" style="margin-top:6px" onclick="freeReplyMsg(${m.id})">${t('send')}</button></div>`}else{h+=`<div class="bub m">${esc(m.myReply||'')}</div><div class="bub c">${esc(m.custReply||'')}</div><div>${m.chips||''}</div>`}return h}}return `<h2>${t('msgTitle')}</h2>`+(S.msgs.length?S.msgs.map(m=>`<div class="card row" onclick="S.th=${m.id};sfx('click');render()" style="cursor:pointer"><div class="av">${m.ic}</div><div class="grow"><b>${m.n}</b> ${m.done===null?`<span class="chip r" style="margin:0">${t('newMsg')}</span>`:''}<br><small>${m.done===null?MS[m.d].q.slice(0,46)+'…':t('replied')}</small></div></div>`).join(''):`<div class="card"><small>${t('noMsg')}</small></div>`)}
function fbTab(){const a=S.fbs,n=a.length,avg=n?a.reduce((x,y)=>x+y.s,0)/n:0;let h=`<h2>${t('fbTitle')}</h2><div class="card"><div class="row"><div style="text-align:center"><b style="font-size:34px">${n?f1(avg):'—'}</b><br><span class="st">${stars(Math.round(avg))}</span><br><small>${n} ${t('reviews')}</small></div><div class="grow">${[5,4,3,2,1].map(s=>{const c=a.filter(x=>x.s===s).length;return `<div class="row" style="gap:6px;font-size:12px"><span>${s}★</span><div class="bar grow" style="height:8px"><i style="width:${n?c/n*100:0}%"></i></div></div>`}).join('')}</div></div></div>`;h+=a.map((f,idx)=>`<div class="card"><span style="font-size:18px">${f.ic}</span> <b>${f.n}</b> <span class="st">${stars(f.s)}</span> <small>· ${t('day')} ${f.day}</small><br><span style="font-size:14px">“${esc(f.t)}”</span>${f.replied?`<div class="bub m" style="margin-top:6px">${esc(f.reply)}</div>`:`<button class="reply-btn" onclick="openReply(${idx})">${t('reply')}</button>`}</div>`).join('');return h}
function openReply(idx){const f=S.fbs[idx];$('#modal').innerHTML=`<div class="mb"><div class="av">${f.ic}</div><h3>${t('reply')} ${esc(f.n)}</h3><p style="text-align:left">“${esc(f.t)}”</p><textarea id="rp" placeholder="${t('writeReply')}"></textarea><button class="o main" onclick="submitReply(${idx})">${t('send')}</button><button class="o" onclick="$('#modal').style.display='none'">${t('cancel')}</button></div>`;$('#modal').style.display='flex';sfx('click')}
function submitReply(idx){const txt=($('#rp')?.value||'').trim();if(!txt){toast(currentLang==='en'?'Write something!':'Hãy viết gì đó!');return}S.fbs[idx].replied=true;S.fbs[idx].reply=txt;if(isRude(txt)){S.rating=clamp(S.rating-1,1,5);S.fbs[idx].s=1;$('#modal').style.display='none';sfx('bad');save();toast(currentLang==='en'?'😡 Rude reply! −1★':'😡 Trả lời thô tục! Bị trừ 1★');render();return}S.rating=clamp(S.rating+0.05,1,5);$('#modal').style.display='none';sfx('msg');save();toast(currentLang==='en'?'Reply sent! +0.05★':'Đã gửi phản hồi! +0,05★');render()}
function render(){if(['title','guide','name'].includes(S.phase))return intro();const c={home,market,stock,up:upTab,msg:msgTab,fb:fbTab}[S.tab]();$('#app').innerHTML=`<div id="hd">${headHtml()}</div>${c}`;$('#tabs').innerHTML=tabsHtml()}

function mk(){
let n,ic,ppl,familyIcon=null,delivery=false;
if(Math.random()<.55){
n='Gia đình '+rnd(HO);
const kids=1+Math.floor(Math.random()*2);
ic=['👨','👩'];
for(let i=0;i<kids;i++)ic.push(rnd(['👧','👦']));
if(Math.random()<.2)ic.push(rnd(['👴','👵']));
ppl=ic.length;familyIcon='👨‍👩‍👧'
}else{const x=rnd(SOLO);n=cap(x[0]);ic=[x[1]];ppl=1}
if(Math.random()<(S.online?0.4:0.15))delivery=true;
// Đơn phở (nếu mở gian hàng)
const canPho=phoUnlocked()&&(S.stock.pho_ban||0)>0&&(S.stock.pho_dung||0)>0&&(S.ut.bat||0)>0;
if(canPho&&Math.random()<.28){
const bowls=[];
const bn=Math.min(ppl,1+Math.floor(Math.random()*Math.min(3,ppl)));
for(let i=0;i<bn;i++){
const topsAvail=['pho_tom','pho_bo','pho_ga'].filter(id=>(S.stock[id]||0)>0);
const top=topsAvail.length?rnd(topsAvail):null;
const noHanh=Math.random()<.35;
const wantQuay=Math.random()<.4&&(S.stock.pho_quay||0)>0;
const wantHanh=!noHanh&&Math.random()<.5&&(S.stock.pho_hanh||0)>0;
bowls.push({top,noHanh,quay:wantQuay,hanh:wantHanh})
}
let runChance=0.05;if(S.day>=6)runChance=0.08+Math.min(0.25,(S.day-5)*0.025);
return {n,ic,ppl,order:[],pho:true,bowls,pat:100,run:Math.random()<runChance,familyIcon,delivery:false}
}
const avail=av().filter(d=>!(d.needOt&&!(S.stock.ot>0)));
const orderMap={};
if(avail.length){
let maxCnt,maxQty;
if(S.day<=5){maxCnt=1+Math.floor(Math.random()*2);maxQty=Math.min(2,ppl)}
else{maxCnt=2+Math.floor(Math.random()*Math.min(4,1+Math.floor((S.day-5)/2)));maxQty=Math.min(ppl,2+Math.floor((S.day-5)/3))}
const cnt=Math.min(avail.length,maxCnt);
const shuffled=[...avail].sort(()=>Math.random()-.5).slice(0,cnt);
shuffled.forEach(d=>{
const maxQ=Math.min(ppl,S.stock[d.id]||0,maxQty);
if(maxQ<=0)return;
const qty=Math.max(1,Math.min(maxQ,1+Math.floor(Math.random()*maxQty)));
orderMap[d.id]=(orderMap[d.id]||0)+qty;
if(d.needTop){
let tops=TOP.filter(tp=>tp.for.includes(d.id)&&(S.stock[tp.id]||0)>0);
if(d.needOt){ // bắt buộc ớt
if((S.stock.ot||0)>0)orderMap.ot=(orderMap.ot||0)+Math.min(qty,S.stock.ot||0);
tops=tops.filter(tp=>tp.id!=='ot')
}
if(tops.length){
const tcnt=1+Math.floor(Math.random()*Math.min(S.day<=5?1:2,tops.length));
[...tops].sort(()=>Math.random()-.5).slice(0,tcnt).forEach(tp=>{
const maxT=S.stock[tp.id]||0;if(maxT<=0)return;
const tq=Math.max(1,Math.min(maxT,qty,1+Math.floor(Math.random()*(S.day<=5?1:2))));
orderMap[tp.id]=(orderMap[tp.id]||0)+tq;
if(orderMap[tp.id]>maxT)orderMap[tp.id]=maxT
})
}
}
if(orderMap[d.id]>(S.stock[d.id]||0))orderMap[d.id]=S.stock[d.id]||0
})
}
const order=Object.keys(orderMap).filter(id=>orderMap[id]>0).map(id=>({id,qty:orderMap[id]}));
let runChance=0.05;
if(S.day>=6)runChance=0.08+Math.min(0.25,(S.day-5)*0.025);
if(delivery)runChance+=0.04;
if(S.staff.online_nv&&delivery)runChance*=0.5;
return {n,ic,ppl,order,pat:100,run:Math.random()<runChance,familyIcon,delivery,pho:false}
}
function maxSimul(){return (S.day>=2?2:1)+(S.up.seat||0)}
function stashCur(){if(L&&L.cur){L.cur.tray=L.tray;L.cur.phoTray=L.phoTray;L.cur.phoMode=L.phoMode}}
function selectCust(id){if(!L)return;const c=L.custs.find(x=>x.id===id);if(!c||L.cur===c)return;stashCur();L.cur=c;L.tray=c.tray||(c.tray={});L.phoTray=c.phoTray||null;L.phoMode=!!c.phoMode;sfx('click');render()}
function removeCust(c){if(!L)return;L.custs=L.custs.filter(x=>x!==c);if(L.cur===c){L.cur=null;L.tray={};L.phoMode=false;L.phoTray=null}}
function openShop(){
if(overpriced().length){toast('🐶 Bán Rẻ thì lỗ mà Đắt Quá thì chó cũng không ăn');sfx('bad');return}
if(!av().length&&!(phoUnlocked()&&(S.stock.pho_ban||0)>0)){toast('Hãy nhập món ở 🛒 Chợ trước!');sfx('bad');return}
if((S.ut.dua||0)<1||(S.ut.bat||0)<1){toast('Cần mua Đũa và Bát!');sfx('bad');return}
const slow=Math.random()<0.1; // ~10% ngày ế
S.phase='open';L={t:0,cur:null,custs:[],nid:1,tray:{},served:0,turned:0,rev:0,scores:[],log:[`🔔 ${esc(S.name)} mở cửa!`+(slow?' (Hôm nay vắng khách…)':'')],runners:0,lost:0,pop:0,evn:0,evc:0,clock:'10:00',pendingCrime:null,slow,phoMode:false,phoTray:null};
if(slow)toast(currentLang==='en'?'Quiet day…':'Hôm nay quán hơi ế…');
paused=false;sfx('bell');save();render();timer=setInterval(tick,TICK_MS)
}
function tick(){
if(!L||paused)return;
L.t++;
// Đồng hồ ảo 10:00 → 22:00 trong đúng dayMinutes phút thật
const span=GAME_END_MIN-GAME_START_MIN;
const gMin=GAME_START_MIN+Math.floor((Math.min(L.t,TICKS)/TICKS)*span);
const hh=Math.floor(gMin/60)%24,mm=gMin%60;
L.clock=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
L.pop=0;
[...L.custs].forEach(c=>{c.pat-=(1.2+(S.price>60000?0.4:0)-S.up.ac*0.15-(S.staff.phucvu?0.25:0));if(c.pat<=0){L.turned++;L.scores.push(1);S.fbs.unshift({n:c.n,ic:c.familyIcon||c.ic.join(''),s:1,t:review(1),day:S.day,replied:false,reply:''});L.log.push(`😡 ${c.n} hết kiên nhẫn, bỏ về`);removeCust(c);sfx('bad')}});
if(S.staff.phucvu&&Math.random()<.4){
const c=L.custs.find(x=>!x.pho&&x.pat<90&&x.order.every(o=>(S.stock[o.id]||0)>=o.qty)&&(S.ut.dua||0)>=x.ppl&&(S.ut.bat||0)>=x.ppl);
if(c){stashCur();const prev=L.cur;L.cur=c;L.tray={};c.order.forEach(o=>L.tray[o.id]=o.qty);L.log.push('🧑‍🍳 Lan bưng món giúp bạn!');ringBell();
if(prev&&L.custs.includes(prev)){L.cur=prev;L.tray=prev.tray||{};L.phoTray=prev.phoTray||null;L.phoMode=!!prev.phoMode}else{L.cur=null;L.tray={};L.phoTray=null;L.phoMode=false}
if(L.pendingShip)return}}
const outOfSets=(S.ut.dua||0)<1||(S.ut.bat||0)<1;
const outOfFood=!av().length||outOfSets;
if(L.t>=TICKS||outOfFood){
if(!L.custs.length){clearInterval(timer);paused=false;if(L.t<TICKS)toast(outOfSets?(currentLang==='en'?'Out of bowls/chopsticks — shop closed':'Hết bát đũa — tiệm tự đóng cửa'):(currentLang==='en'?'Out of food — day ended':'Hết món — kết thúc ngày'));endDay();return}
}else if(L.custs.length<maxSimul()){
const dayBoost=S.day<=5?0.9:(1+Math.min(1.2,(S.day-5)*0.12));
const pf=clamp(1.4-S.price/65000,.15,1.15);
let p=(.03+Math.pow(S.rating/5,2)*.22+S.up.deco*.02)*pf*dayBoost;
if(overpriced().length)p=0;
if(L.slow)p*=0.12; // ngày ế
const free=maxSimul()-L.custs.length;
for(let k=0;k<free;k++){
if(Math.random()<p){
const g=mk();
if(g.order.length||g.pho){
const used=L.custs.map(x=>x.table);let tb=0;while(used.includes(tb))tb++;
g.id=L.nid++;g.table=tb;g.tray={};L.custs.push(g);
if(maxSimul()===1){L.cur=g;L.tray=g.tray}
L.log.push(`${g.familyIcon||g.ic.join('')} ${g.n} ${g.delivery?'🛵 đặt ship':'đến gọi món'} · 🪑${tb+1}`);
sfx('pop')
}
}
}
}
if(S.day>=2&&Math.random()<.025&&S.msgs.filter(m=>m.done===null).length<5){addMsg(1);toast('💬 Có tin nhắn mới!');sfx('msg')}
if(L.t>12&&L.t<TICKS-8&&L.evc<2&&L.custs.length&&Math.random()<.018){S.tab==='home'?render():hd();showEvent();return}
S.tab==='home'?render():hd()
}
function callPolice(){
if(!L||S.phase!=='open')return;
if(S.day<7){toast(currentLang==='en'?'Unlocks from day 7':'Mở khóa từ ngày 7');sfx('bad');return}
const crime=L.pendingCrime;
if(!crime){toast(currentLang==='en'?'No runaway to report':'Chưa có vụ quỵt tiền để báo');sfx('bad');return}
clearInterval(timer);
// Tỷ lệ bắt được: ~45% + bảo vệ + NV
let catchRate=0.42+S.up.sec*0.08+(S.staff.phucvu?0.05:0);
const caught=Math.random()<catchRate;
const name=crime.n,amt=crime.pay;
L.pendingCrime=null;
if(caught){
S.money+=amt;L.rev+=amt;L.lost=Math.max(0,(L.lost||0)-amt);L.runners=Math.max(0,(L.runners||0)-1);
L.log.push(`👮 Công an bắt được ${name}! Trả lại ${fmt(amt)}`);
$('#modal').innerHTML=`<div class="mb">
<div class="av" style="font-size:40px">👮</div>
<span class="tag">${currentLang==='en'?'CAUGHT':'BẮT ĐƯỢC'}</span>
<h3>${currentLang==='en'?'Suspect caught!':'Bắt được đối tượng!'}</h3>
<p><b>${esc(name)}</b> ${currentLang==='en'?'was arrested and returned':'đã bị bắt và trả lại'} <b>${fmt(amt)}</b>.</p>
<button class="o main" onclick="closePolice()">${currentLang==='en'?'Continue':'Tiếp tục'}</button>
</div>`;
sfx('coin');toast(`👮 Bắt được ${name}! +${fmt(amt)}`)
}else{
L.log.push(`👮 Công an không tìm thấy ${name}. Mất ${fmt(amt)}`);
$('#modal').innerHTML=`<div class="mb">
<div class="av" style="font-size:40px">😶</div>
<span class="tag">${currentLang==='en'?'FAILED':'KHÔNG BẮT ĐƯỢC'}</span>
<h3>${currentLang==='en'?'Suspect got away':'Đối tượng tẩu thoát'}</h3>
<p><b>${esc(name)}</b> ${currentLang==='en'?'was not found. Shop lost':'không tìm thấy. Quán mất'} <b>${fmt(amt)}</b>.</p>
<button class="o main" onclick="closePolice()">${currentLang==='en'?'Continue':'Tiếp tục'}</button>
</div>`;
sfx('bad');toast(`Không bắt được ${name}`)
}
$('#modal').style.display='flex';save()
}
function closePolice(){
$('#modal').style.display='none';
if(S.phase==='open'&&L)timer=setInterval(tick,TICK_MS);
if(S.tab==='home')render();else hd()
}
function showEvent(){clearInterval(timer);L.evc++;const e=rnd(EV),n=cap(rnd(SOLO)[0]);EC=e;$('#modal').innerHTML=`<div class="mb"><div class="av">${e.ic}</div><span class="tag">${e.tag}</span><h3>${e.t(n)}</h3><p>${e.d(n)}</p>${e.o.map((o,i)=>`<button class="o ${i?'':'main'}" onclick="pick(${i})">${o.t}<small>${o.s}</small></button>`).join('')}</div>`;$('#modal').style.display='flex';sfx('pop')}
function pick(i){const r=EC.o[i].f();$('#modal').innerHTML=`<div class="mb"><div class="em" style="font-size:44px">${EC.ic}</div><h3>${EC.o[i].t}</h3><p>${r[0]}</p><div>${r[1]}</div><button class="o main" onclick="closeEv()">Tiếp tục</button></div>`;sfx('click')}
function closeEv(){$('#modal').style.display='none';if(S.phase==='open'){timer=setInterval(tick,TICK_MS);S.tab==='home'?render():hd()}}
function endDay(){
const sc=L.scores,avg=sc.length?sc.reduce((a,b)=>a+b,0)/sc.length:0;
if(sc.length)S.rating=clamp(S.rating*.7+avg*.3,1,5);
let keep=.5+.15*S.up.fr+(S.staff.bep?0.1:0);
keep=Math.min(0.95,keep);
D.forEach(d=>S.stock[d.id]=Math.floor((S.stock[d.id]||0)*keep));
TOP.forEach(t=>S.stock[t.id]=Math.floor((S.stock[t.id]||0)*keep));
PHO.forEach(p=>S.stock[p.id]=Math.floor((S.stock[p.id]||0)*keep));
S.ut.dua=Math.floor((S.ut.dua||0)*.85);S.ut.bat=Math.floor((S.ut.bat||0)*.85);
// Trả lương nhân viên
let sal=0;
STAFF.forEach(st=>{if(S.staff[st.id])sal+=st.sal});
if(sal>0){S.money=Math.max(0,S.money-sal);L.evn=(L.evn||0)-sal}
S.sum={served:L.served,turned:L.turned,rev:L.rev,avg,runners:L.runners,lost:L.lost,evn:L.evn,salary:sal};
S.phase='end';S.tab='home';L=null;sfx('coin');save();render()
}
function nextDay(){S.day++;S.spent=0;S.phase='prep';if(S.day>=2)addMsg(2);if(S.money<2000&&!D.some(d=>(S.stock[d.id]||0)>0)&&(S.ut.dua||0)<5)S.phase='bust';sfx('click');save();render()}

loadSoundPref();loadTheme();loadDayLen();loadLang();
// Loading thanh kẹo → vào trang chủ (ảnh quán buffet hồng) · nút Bắt đầu/Tiếp tục ở trang chủ, không load lại
(function runLoading(){
let p=0;
const bar=document.getElementById('candyBar');
const pct=document.getElementById('loadPct');
const ld=document.getElementById('loading');
const sub=document.querySelector('.load-sub');
if(ld){ld.classList.remove('hide');ld.style.display='flex'}
const iv=setInterval(()=>{
p+=2.5+Math.random()*3.5;
if(p>=100){
p=100;clearInterval(iv);
if(bar)bar.style.width='100%';
if(pct)pct.textContent='100%';
if(sub)sub.textContent=currentLang==='en'?'Ready!':'Sẵn sàng!';
setTimeout(()=>{
if(ld){ld.classList.add('hide');setTimeout(()=>{try{ld.remove()}catch(e){}},450)}
showTitle(); // trang chủ buffet (ảnh cửa tiệm hồng) + nút Tiếp tục / Bắt đầu mới
},400);
return
}
if(bar)bar.style.width=p+'%';
if(pct)pct.textContent=Math.floor(p)+'%';
},70);
})();
document.body.addEventListener('click',()=>{ensureAudio();if(soundOn)startBGM()},{once:true});
</script>
